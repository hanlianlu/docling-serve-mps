[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docling-serve-mps"
version = "0.1.0"
description = "Native MPS deployment wrapper for Docling Serve on Apple Silicon"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Hanlian Lyu", email = "hanlianlyu@outlook.com" }]
maintainers = [{ name = "Hanlian Lyu", email = "hanlianlyu@outlook.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "docling-serve[ui]>=1.28.0",
    "docling-slim[feat-ocr-mac]>=2.115.0",
]

[project.scripts]
docling-serve-mps = "docling_serve_mps.cli:main"

[project.urls]
Homepage = "https://github.com/hanlianlu/docling-serve-mps"
Repository = "https://github.com/hanlianlu/docling-serve-mps"
Issues = "https://github.com/hanlianlu/docling-serve-mps/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/docling_serve_mps"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/service.env",
    "/service.sh",
    "/src",
    "/tests",
    "/uv.lock",
]
